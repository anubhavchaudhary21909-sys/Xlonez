
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: white;
        }
        
        .app {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            font-size: 48px;
            margin-bottom: 10px;
        }
        
        .title {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
        }
        
        .media-switch {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 25px;
        }
        
        .switch-btn {
            flex: 1;
            padding: 15px;
            border: none;
            background: transparent;
            color: rgba(255, 255, 255, 0.6);
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .switch-btn.active {
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4);
            color: white;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }
        
        .input-container {
            position: relative;
            margin-bottom: 25px;
        }
        
        .url-input {
            width: 100%;
            padding: 18px 20px 18px 55px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        .url-input:focus {
            outline: none;
            border-color: #4ecdc4;
            box-shadow: 0 0 0 3px rgba(78, 205, 196, 0.2);
        }
        
        .input-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: #4ecdc4;
        }
        
        .primary-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4);
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
        }
        
        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(255, 107, 107, 0.4);
        }
        
        .result-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 25px;
            margin-top: 25px;
            display: none;
            animation: slideUp 0.5s ease;
        }
        
        .result-box.show {
            display: block;
        }
        
        .result-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
            color: #4ecdc4;
            font-size: 18px;
        }
        
        .generated-link {
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 10px;
            font-family: 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            word-break: break-all;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .action-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        
        .action-btn {
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
        }
        
        .copy-btn {
            background: rgba(78, 205, 196, 0.2);
            color: #4ecdc4;
            border: 1px solid rgba(78, 205, 196, 0.3);
        }
        
        .view-btn {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.3);
        }
        
        .share-btn {
            background: rgba(108, 92, 231, 0.2);
            color: #6c5ce7;
            border: 1px solid rgba(108, 92, 231, 0.3);
        }
        
        .action-btn:hover {
            transform: translateY(-2px);
        }
        
        .player {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: 1000;
            display: none;
        }
        
        .player video,
        .player iframe,
        .player img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        
        .player-controls {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1001;
            display: flex;
            gap: 10px;
        }
        
        .control-btn {
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .control-btn:hover {
            background: rgba(0, 0, 0, 0.9);
        }
        
        .image-controls {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 1001;
            display: flex;
            gap: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border-radius: 10px;
        }
        
        .zoom-btn {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .zoom-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .info-text {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            margin-top: 20px;
            line-height: 1.5;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @media (max-width: 600px) {
            .app {
                padding: 20px;
                margin: 10px;
            }
            
            .action-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app" id="main">
        <div class="header">
            <div class="logo">🎬</div>
            <h1 class="title">Media Player</h1>
            <p class="subtitle">Share videos & images instantly</p>
        </div>
        
        <div class="media-switch">
            <button class="switch-btn active" onclick="setMediaType('video')">
                <span>🎥</span> Video
            </button>
            <button class="switch-btn" onclick="setMediaType('image')">
                <span>🖼️</span> Image
            </button>
        </div>
        
        <div class="input-container">
            <div class="input-icon" id="mediaIcon">🔗</div>
            <input type="text" 
                   class="url-input" 
                   id="mediaUrl" 
                   placeholder="Paste your video or image URL here..."
                   autocomplete="off">
        </div>
        
        <button class="primary-btn" onclick="createLink()">
            <span>✨</span> Generate Shareable Link
        </button>
        
        <div class="result-box" id="resultBox">
            <div class="result-title">
                <span>📋</span> Your Shareable Link
            </div>
            <div class="generated-link" id="linkText"></div>
            <div class="action-buttons">
                <button class="action-btn copy-btn" onclick="copyLink()">
                    <span>📋</span> Copy
                </button>
                <button class="action-btn view-btn" onclick="viewMedia()">
                    <span>👁️</span> Preview
                </button>
                <button class="action-btn share-btn" onclick="shareLink()">
                    <span>📤</span> Share
                </button>
            </div>
        </div>
        
        <div class="info-text">
            Supports: MP4, WebM, YouTube, Vimeo, JPG, PNG, GIF, WebP
        </div>
    </div>
    
    <div class="player" id="player">
        <div class="player-controls">
            <button class="control-btn" onclick="closePlayer()">
                <span>←</span> Back
            </button>
            <button class="control-btn" onclick="toggleFullscreen()" id="fullscreenBtn">
                <span>⛶</span> Fullscreen
            </button>
        </div>
        <div class="image-controls" id="imageControls" style="display: none;">
            <button class="zoom-btn" onclick="zoomImage(0.2)">+</button>
            <button class="zoom-btn" onclick="zoomImage(-0.2)">-</button>
            <button class="zoom-btn" onclick="resetImage()">⟳</button>
        </div>
    </div>

    <script>
        let mediaType = 'video';
        let currentMediaId = null;
        let isFullscreen = false;
        
        // Set media type (video or image)
        function setMediaType(type) {
            mediaType = type;
            
            // Update active button
            document.querySelectorAll('.switch-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // Update icon and placeholder
            const icon = document.getElementById('mediaIcon');
            const input = document.getElementById('mediaUrl');
            
            if (type === 'video') {
                icon.textContent = '🎥';
                input.placeholder = 'Paste video URL (MP4, YouTube, Vimeo, etc.)';
            } else {
                icon.textContent = '🖼️';
                input.placeholder = 'Paste image URL (JPG, PNG, GIF, etc.)';
            }
            
            // Clear previous result
            document.getElementById('resultBox').classList.remove('show');
        }
        
        // Create shareable link
        function createLink() {
            const url = document.getElementById('mediaUrl').value.trim();
            
            if (!url) {
                showMessage('Please enter a URL', 'error');
                return;
            }
            
            // Validate URL
            if (!isValidUrl(url)) {
                showMessage('Please enter a valid URL (starting with http:// or https://)', 'error');
                return;
            }
            
            // Generate unique ID
            currentMediaId = generateUniqueId();
            
            // Store media data
            const mediaData = {
                url: url,
                type: mediaType,
                timestamp: Date.now(),
                views: 0
            };
            
            localStorage.setItem(`media_${currentMediaId}`, JSON.stringify(mediaData));
            
            // Generate shareable link
            const link = `${window.location.origin}${window.location.pathname}?id=${currentMediaId}`;
            
            // Display result
            document.getElementById('linkText').textContent = link;
            document.getElementById('resultBox').classList.add('show');
            
            // Clear input
            document.getElementById('mediaUrl').value = '';
            
            // Show success message
            showMessage(`${mediaType === 'video' ? 'Video' : 'Image'} link created successfully!`, 'success');
        }
        
        // Generate unique ID
        function generateUniqueId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
        }
        
        // Validate URL
        function isValidUrl(string) {
            try {
                new URL(string);
                return true;
            } catch (_) {
                return false;
            }
        }
        
        // Copy link to clipboard
        function copyLink() {
            const link = document.getElementById('linkText').textContent;
            navigator.clipboard.writeText(link).then(() => {
                showMessage('Link copied to clipboard!', 'success');
            }).catch(err => {
                showMessage('Failed to copy link', 'error');
            });
        }
        
        // Preview media
        function viewMedia() {
            if (currentMediaId) {
                openPlayer(currentMediaId);
            }
        }
        
        // Share link
        function shareLink() {
            const link = document.getElementById('linkText').textContent;
            
            if (navigator.share) {
                navigator.share({
                    title: `Check out this ${mediaType}!`,
                    text: `I'm sharing a ${mediaType} with you`,
                    url: link
                }).then(() => {
                    showMessage('Shared successfully!', 'success');
                }).catch(err => {
                    copyLink();
                });
            } else {
                copyLink();
            }
        }
        
        // Open player with media
        function openPlayer(mediaId) {
            const mediaData = JSON.parse(localStorage.getItem(`media_${mediaId}`));
            
            if (!mediaData) {
                showMessage('Media not found', 'error');
                return;
            }
            
            // Hide main app, show player
            document.getElementById('main').style.display = 'none';
            document.getElementById('player').style.display = 'block';
            
            const playerDiv = document.getElementById('player');
            
            // Clear previous content
            const existingMedia = playerDiv.querySelector('video, iframe, img');
            if (existingMedia) {
                existingMedia.remove();
            }
            
            // Show/hide image controls
            const imageControls = document.getElementById('imageControls');
            imageControls.style.display = mediaData.type === 'image' ? 'flex' : 'none';
            
            if (mediaData.type === 'video') {
                // Handle video
                if (isYouTubeUrl(mediaData.url)) {
                    const videoId = extractYouTubeId(mediaData.url);
                    const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0&modestbranding=1`;
                    const iframe = document.createElement('iframe');
                    iframe.src = embedUrl;
                    iframe.allow = 'autoplay; encrypted-media; fullscreen';
                    iframe.allowFullscreen = true;
                    playerDiv.appendChild(iframe);
                } else if (isVimeoUrl(mediaData.url)) {
                    const videoId = extractVimeoId(mediaData.url);
                    const embedUrl = `https://player.vimeo.com/video/${videoId}?autoplay=1`;
                    const iframe = document.createElement('iframe');
                    iframe.src = embedUrl;
                    iframe.allow = 'autoplay; fullscreen';
                    iframe.allowFullscreen = true;
                    playerDiv.appendChild(iframe);
                } else {
                    const video = document.createElement('video');
                    video.src = mediaData.url;
                    video.controls = true;
                    video.autoplay = true;
                    video.style.width = '100%';
                    video.style.height = '100%';
                    playerDiv.appendChild(video);
                }
            } else {
                // Handle image
                const img = document.createElement('img');
                img.src = mediaData.url;
                img.alt = 'Shared Image';
                img.style.width = '100%';
                img.style.height = '100%';
                img.style.objectFit = 'contain';
                playerDiv.appendChild(img);
                
                // Store reference for zoom
                window.currentImage = img;
                window.currentZoom = 1;
            }
            
            // Update view count
            mediaData.views = (mediaData.views || 0) + 1;
            localStorage.setItem(`media_${mediaId}`, JSON.stringify(mediaData));
        }
        
        // Close player
        function closePlayer() {
            document.getElementById('player').style.display = 'none';
            document.getElementById('main').style.display = 'block';
            
            // Exit fullscreen if active
            if (isFullscreen && document.fullscreenElement) {
                document.exitFullscreen();
                isFullscreen = false;
            }
        }
        
        // Toggle fullscreen
        function toggleFullscreen() {
            const player = document.getElementById('player');
            
            if (!isFullscreen) {
                player.requestFullscreen().then(() => {
                    isFullscreen = true;
                    document.getElementById('fullscreenBtn').innerHTML = '<span>⛶</span> Exit Fullscreen';
                }).catch(err => {
                    showMessage('Fullscreen not supported', 'error');
                });
            } else {
                document.exitFullscreen().then(() => {
                    isFullscreen = false;
                    document.getElementById('fullscreenBtn').innerHTML = '<span>⛶</span> Fullscreen';
                });
            }
        }
        
        // Image zoom functions
        function zoomImage(amount) {
            if (window.currentImage) {
                window.currentZoom += amount;
                window.currentZoom = Math.max(0.5, Math.min(5, window.currentZoom));
                window.currentImage.style.transform = `scale(${window.currentZoom})`;
                window.currentImage.style.transformOrigin = 'center center';
                window.currentImage.style.transition = 'transform 0.2s ease';
            }
        }
        
        function resetImage() {
            if (window.currentImage) {
                window.currentZoom = 1;
                window.currentImage.style.transform = 'scale(1)';
            }
        }
        
        // URL detection helpers
        function isYouTubeUrl(url) {
            return url.includes('youtube.com') || url.includes('youtu.be');
        }
        
        function extractYouTubeId(url) {
            const regExp = /^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/;
            const match = url.match(regExp);
            return (match && match[7].length === 11) ? match[7] : null;
        }
        
        function isVimeoUrl(url) {
            return url.includes('vimeo.com');
        }
        
        function extractVimeoId(url) {
            const regExp = /vimeo\.com\/(\d+)/;
            const match = url.match(regExp);
            return match ? match[1] : null;
        }
        
        // Show message
        function showMessage(text, type) {
            // Remove existing message
            const existingMsg = document.querySelector('.message');
            if (existingMsg) {
                existingMsg.remove();
            }
            
            // Create message element
            const msg = document.createElement('div');
            msg.className = `message message-${type}`;
            msg.textContent = text;
            msg.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                padding: 15px 25px;
                background: ${type === 'success' ? 'rgba(78, 205, 196, 0.9)' : 'rgba(255, 107, 107, 0.9)'};
                color: white;
                border-radius: 10px;
                font-weight: 600;
                z-index: 10000;
                animation: slideIn 0.3s ease;
                box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            `;
            
            document.body.appendChild(msg);
            
            // Remove after 3 seconds
            setTimeout(() => {
                msg.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => {
                    if (msg.parentNode) {
                        msg.remove();
                    }
                }, 300);
            }, 3000);
        }
        
        // Add animation styles
        const style = document.createElement('style');
        style.textContent = `
            @keyframes slideIn {
                from { transform: translateX(100%); opacity: 0; }
                to { transform: translateX(0); opacity: 1; }
            }
            @keyframes slideOut {
                from { transform: translateX(0); opacity: 1; }
                to { transform: translateX(100%); opacity: 0; }
            }
        `;
        document.head.appendChild(style);
        
        // Check for media ID on page load
        function checkForMedia() {
            const params = new URLSearchParams(window.location.search);
            const mediaId = params.get('id');
            
            if (mediaId) {
                openPlayer(mediaId);
            }
        }
        
        // Handle fullscreen change
        document.addEventListener('fullscreenchange', function() {
            isFullscreen = !!document.fullscreenElement;
            const btn = document.getElementById('fullscreenBtn');
            if (btn) {
                btn.innerHTML = isFullscreen ? '<span>⛶</span> Exit Fullscreen' : '<span>⛶</span> Fullscreen';
            }
        });
        
        // Initialize
        checkForMedia();
    </script>
</body>
</html>
