
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>XLonez Media Player</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  color: #fff;
  min-height: 100vh;
  padding: 20px;
}

.app {
  max-width: 450px;
  margin: 80px auto;
  padding: 35px;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(10px);
  border-radius: 20px;
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.1);
}

h1 {
  text-align: center;
  margin-bottom: 25px;
  font-size: 32px;
  font-weight: 700;
  background: linear-gradient(90deg, #ff6b6b, #4ecdc4);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.media-switch {
  display: flex;
  background: rgba(0, 0, 0, 0.3);
  border-radius: 12px;
  padding: 5px;
  margin-bottom: 20px;
}

.switch-btn {
  flex: 1;
  padding: 12px;
  border: none;
  background: transparent;
  color: rgba(255, 255, 255, 0.6);
  border-radius: 10px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.switch-btn.active {
  background: linear-gradient(90deg, #ff6b6b, #4ecdc4);
  color: white;
  box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
}

.input-container {
  position: relative;
  margin-bottom: 20px;
}

.url-input {
  width: 100%;
  padding: 15px 15px 15px 45px;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.2);
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  font-size: 15px;
  transition: all 0.3s ease;
}

.url-input:focus {
  outline: none;
  border-color: rgba(255, 255, 255, 0.4);
  box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
}

.url-input::placeholder {
  color: rgba(255, 255, 255, 0.5);
}

.input-icon {
  position: absolute;
  left: 15px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 18px;
  color: #4ecdc4;
}

.expiry-input {
  width: 100%;
  padding: 12px;
  margin-bottom: 20px;
  border-radius: 6px;
  border: none;
  background: rgba(255, 255, 255, 0.1);
  color: #fff;
  font-size: 14px;
}

.primary-btn {
  width: 100%;
  padding: 15px;
  background: linear-gradient(90deg, #ff6b6b, #4ecdc4);
  border: none;
  border-radius: 10px;
  color: #fff;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  margin-bottom: 15px;
  box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
}

.primary-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 15px 25px rgba(255, 107, 107, 0.4);
}

.link-box {
  margin-top: 25px;
  padding: 15px;
  background: rgba(0, 0, 0, 0.3);
  border-radius: 10px;
  font-size: 14px;
  word-break: break-all;
  color: #00e0ff;
  border: 1px solid rgba(0, 243, 255, 0.2);
  transition: all 0.3s ease;
  display: none;
}

.link-box.show {
  display: block;
  animation: slideUp 0.5s ease;
}

.generated-link {
  background: rgba(0, 0, 0, 0.5);
  padding: 15px;
  border-radius: 10px;
  font-family: 'Monaco', 'Courier New', monospace;
  font-size: 14px;
  word-break: break-all;
  margin-bottom: 20px;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.action-buttons {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 15px;
}

.action-btn {
  padding: 12px;
  border: none;
  border-radius: 8px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 14px;
}

.copy-btn {
  background: rgba(78, 205, 196, 0.2);
  color: #4ecdc4;
  border: 1px solid rgba(78, 205, 196, 0.3);
}

.copy-btn:hover {
  background: rgba(78, 205, 196, 0.3);
}

.view-btn {
  background: rgba(255, 107, 107, 0.2);
  color: #ff6b6b;
  border: 1px solid rgba(255, 107, 107, 0.3);
}

.view-btn:hover {
  background: rgba(255, 107, 107, 0.3);
}

.share-btn {
  background: rgba(108, 92, 231, 0.2);
  color: #6c5ce7;
  border: 1px solid rgba(108, 92, 231, 0.3);
}

.share-btn:hover {
  background: rgba(108, 92, 231, 0.3);
}

/* PLAYER PAGE */
.player {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #000;
  z-index: 1000;
  display: none;
}

.player video,
.player iframe,
.player img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.player-controls {
  position: fixed;
  top: 20px;
  left: 20px;
  z-index: 1001;
  display: flex;
  gap: 10px;
}

.control-btn {
  background: rgba(0, 0, 0, 0.7);
  color: white;
  border: none;
  padding: 12px 20px;
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  transition: all 0.3s ease;
}

.control-btn:hover {
  background: rgba(0, 0, 0, 0.9);
}

.image-controls {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 1001;
  display: none;
  gap: 10px;
  background: rgba(0, 0, 0, 0.7);
  padding: 10px;
  border-radius: 10px;
}

.zoom-btn {
  background: rgba(255, 255, 255, 0.1);
  color: white;
  border: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.zoom-btn:hover {
  background: rgba(255, 255, 255, 0.2);
}

.info-text {
  text-align: center;
  color: rgba(255, 255, 255, 0.5);
  font-size: 13px;
  margin-top: 20px;
  line-height: 1.5;
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (max-width: 600px) {
  .app {
    padding: 20px;
    margin: 10px auto;
  }
  
  .action-buttons {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="app" id="home">
  <h1>XLonez Media Player</h1>
  
  <div class="media-switch">
    <button class="switch-btn active" data-type="video">
      <span>🎥</span> Video
    </button>
    <button class="switch-btn" data-type="image">
      <span>🖼️</span> Image
    </button>
  </div>

  <div class="input-container">
    <div class="input-icon" id="mediaIcon">🎥</div>
    <input type="text" 
           class="url-input" 
           id="mediaUrl" 
           placeholder="Paste video URL (MP4, YouTube, Vimeo, etc.)"
           autocomplete="off">
  </div>

  <input id="expiry" type="number" placeholder="Expiry (minutes) optional" class="expiry-input">

  <button class="primary-btn" id="generateBtn">Generate Link</button>

  <div class="link-box" id="resultBox">
    <div class="generated-link" id="result"></div>
    <div class="action-buttons">
      <button class="action-btn copy-btn" id="copyBtn">
        <span>📋</span> Copy
      </button>
      <button class="action-btn view-btn" id="viewBtn">
        <span>👁️</span> View
      </button>
      <button class="action-btn share-btn" id="shareBtn">
        <span>📤</span> Share
      </button>
    </div>
  </div>
  
  <div class="info-text">
    Supports: MP4, WebM, YouTube, Vimeo, JPG, PNG, GIF, WebP
  </div>
</div>

<div class="player" id="player">
  <div class="player-controls">
    <button class="control-btn" id="backBtn">
      <span>←</span> Back
    </button>
    <button class="control-btn" id="fullscreenBtn">
      <span>⛶</span> Fullscreen
    </button>
  </div>
  <div class="image-controls" id="imageControls">
    <button class="zoom-btn" id="zoomInBtn">+</button>
    <button class="zoom-btn" id="zoomOutBtn">-</button>
    <button class="zoom-btn" id="resetBtn">⟳</button>
  </div>
</div>

<script>
// Initialize variables
let mediaType = 'video';
let currentLinkId = null;

// Set media type function
function setMediaType(type) {
  mediaType = type;
  
  // Update active button
  document.querySelectorAll('.switch-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  
  // Find the clicked button and activate it
  document.querySelector(`.switch-btn[data-type="${type}"]`).classList.add('active');
  
  // Update icon and placeholder
  const icon = document.getElementById('mediaIcon');
  const input = document.getElementById('mediaUrl');
  
  if (type === 'video') {
    icon.textContent = '🎥';
    input.placeholder = 'Paste video URL (MP4, YouTube, Vimeo, etc.)';
  } else {
    icon.textContent = '🖼️';
    input.placeholder = 'Paste image URL (JPG, PNG, GIF, etc.)';
  }
}

// Generate link function
function generateLink() {
  const url = document.getElementById('mediaUrl').value.trim();
  const expiry = document.getElementById('expiry').value;

  if (!url) {
    alert("Please enter a URL");
    return;
  }

  // Basic URL validation
  if (!url.startsWith('http://') && !url.startsWith('https://')) {
    alert("Please enter a valid URL starting with http:// or https://");
    return;
  }

  // Generate unique ID
  const id = Math.random().toString(36).substring(2, 9);
  
  // Store data
  const data = {
    url: url,
    type: mediaType,
    expiry: expiry ? Date.now() + expiry * 60000 : null,
    created: new Date().toISOString()
  };

  localStorage.setItem(id, JSON.stringify(data));

  // Create link
  const link = window.location.origin + window.location.pathname + "?watch=" + id;
  
  // Display result
  document.getElementById('result').innerText = link;
  document.getElementById('resultBox').classList.add('show');
  
  // Store current ID
  currentLinkId = id;
  
  // Auto-select link text
  const range = document.createRange();
  const selection = window.getSelection();
  range.selectNodeContents(document.getElementById('result'));
  selection.removeAllRanges();
  selection.addRange(range);
}

// Copy link function
function copyLink() {
  const linkText = document.getElementById('result').innerText;
  if (!linkText || linkText === '') {
    alert('No link to copy');
    return;
  }
  
  navigator.clipboard.writeText(linkText).then(() => {
    // Visual feedback
    const copyBtn = document.getElementById('copyBtn');
    const originalHTML = copyBtn.innerHTML;
    copyBtn.innerHTML = '<span>✅</span> Copied!';
    copyBtn.style.background = 'rgba(78, 205, 196, 0.4)';
    
    setTimeout(() => {
      copyBtn.innerHTML = originalHTML;
      copyBtn.style.background = '';
    }, 2000);
  }).catch(err => {
    // Fallback method
    const textArea = document.createElement('textarea');
    textArea.value = linkText;
    document.body.appendChild(textArea);
    textArea.select();
    document.execCommand('copy');
    document.body.removeChild(textArea);
    
    alert('Link copied to clipboard!');
  });
}

// View media function
function viewMedia() {
  if (currentLinkId) {
    openPlayer(currentLinkId);
  } else {
    alert('Please generate a link first');
  }
}

// Share link function
function shareLink() {
  const linkText = document.getElementById('result').innerText;
  if (!linkText || linkText === '') {
    alert('No link to share');
    return;
  }
  
  if (navigator.share) {
    navigator.share({
      title: 'XLonez Media Player',
      text: 'Check out this media!',
      url: linkText
    }).catch(err => {
      copyLink();
    });
  } else {
    copyLink();
  }
}

// Open player function
function openPlayer(id) {
  const data = JSON.parse(localStorage.getItem(id));
  if (!data) {
    alert("Media not found");
    return;
  }

  if (data.expiry && Date.now() > data.expiry) {
    alert("This link has expired");
    return;
  }

  // Hide home, show player
  document.getElementById('home').style.display = 'none';
  document.getElementById('player').style.display = 'block';
  
  const playerDiv = document.getElementById('player');
  const imageControls = document.getElementById('imageControls');
  
  // Show/hide image controls
  if (data.type === 'image') {
    imageControls.style.display = 'flex';
  } else {
    imageControls.style.display = 'none';
  }

  // Clear previous content
  const existingMedia = playerDiv.querySelector('video, iframe, img');
  if (existingMedia) {
    existingMedia.remove();
  }

  // Add new media
  if (data.type === 'video') {
    // Handle YouTube
    if (data.url.includes('youtube.com') || data.url.includes('youtu.be')) {
      let videoId = '';
      if (data.url.includes('youtube.com')) {
        const urlParams = new URLSearchParams(new URL(data.url).search);
        videoId = urlParams.get('v');
      } else if (data.url.includes('youtu.be')) {
        videoId = data.url.split('/').pop();
      }
      
      if (videoId) {
        const embedUrl = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
        const iframe = document.createElement('iframe');
        iframe.src = embedUrl;
        iframe.allow = 'autoplay; encrypted-media; fullscreen';
        iframe.allowFullscreen = true;
        playerDiv.appendChild(iframe);
      } else {
        // Fallback to direct URL
        playerDiv.innerHTML = `<iframe src="${data.url}" allowfullscreen></iframe>`;
      }
    } 
    // Handle Vimeo
    else if (data.url.includes('vimeo.com')) {
      const videoId = data.url.split('/').pop();
      if (videoId) {
        const embedUrl = `https://player.vimeo.com/video/${videoId}?autoplay=1`;
        const iframe = document.createElement('iframe');
        iframe.src = embedUrl;
        iframe.allow = 'autoplay; fullscreen';
        iframe.allowFullscreen = true;
        playerDiv.appendChild(iframe);
      } else {
        playerDiv.innerHTML = `<iframe src="${data.url}" allowfullscreen></iframe>`;
      }
    } 
    // Handle direct video
    else {
      const video = document.createElement('video');
      video.src = data.url;
      video.controls = true;
      video.autoplay = true;
      video.style.width = '100%';
      video.style.height = '100%';
      playerDiv.appendChild(video);
    }
  } 
  // Handle image
  else {
    const img = document.createElement('img');
    img.src = data.url;
    img.alt = 'Shared Image';
    img.style.objectFit = 'contain';
    img.style.width = '100%';
    img.style.height = '100%';
    playerDiv.appendChild(img);
    
    // Store reference for zoom
    window.currentImage = img;
    window.currentZoom = 1;
  }
}

// Close player function
function closePlayer() {
  document.getElementById('home').style.display = 'block';
  document.getElementById('player').style.display = 'none';
  document.getElementById('player').innerHTML = '';
  
  // Exit fullscreen if active
  if (document.fullscreenElement) {
    document.exitFullscreen();
  }
}

// Toggle fullscreen
function toggleFullscreen() {
  const player = document.getElementById('player');
  
  if (!document.fullscreenElement) {
    player.requestFullscreen().catch(err => {
      console.log('Fullscreen not supported');
    });
  } else {
    document.exitFullscreen();
  }
}

// Image zoom functions
let currentImage = null;
let currentZoom = 1;

function zoomImage(amount) {
  if (currentImage) {
    currentZoom += amount;
    currentZoom = Math.max(0.5, Math.min(5, currentZoom));
    currentImage.style.transform = `scale(${currentZoom})`;
    currentImage.style.transformOrigin = 'center center';
    currentImage.style.transition = 'transform 0.2s ease';
  }
}

function resetImage() {
  if (currentImage) {
    currentZoom = 1;
    currentImage.style.transform = 'scale(1)';
  }
}

// Check for watch parameter on load
function checkForWatchParam() {
  const params = new URLSearchParams(window.location.search);
  const watchId = params.get('watch');
  
  if (watchId) {
    openPlayer(watchId);
  }
}

// Event Listeners
document.addEventListener('DOMContentLoaded', function() {
  // Media type switch buttons
  document.querySelectorAll('.switch-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const type = this.getAttribute('data-type');
      setMediaType(type);
    });
  });
  
  // Generate button
  document.getElementById('generateBtn').addEventListener('click', generateLink);
  
  // Copy button
  document.getElementById('copyBtn').addEventListener('click', copyLink);
  
  // View button
  document.getElementById('viewBtn').addEventListener('click', viewMedia);
  
  // Share button
  document.getElementById('shareBtn').addEventListener('click', shareLink);
  
  // Player controls
  document.getElementById('backBtn').addEventListener('click', closePlayer);
  document.getElementById('fullscreenBtn').addEventListener('click', toggleFullscreen);
  
  // Image controls
  document.getElementById('zoomInBtn').addEventListener('click', () => zoomImage(0.2));
  document.getElementById('zoomOutBtn').addEventListener('click', () => zoomImage(-0.2));
  document.getElementById('resetBtn').addEventListener('click', resetImage);
  
  // Enter key to generate link
  document.getElementById('mediaUrl').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      generateLink();
    }
  });
  
  // Check for watch parameter on page load
  checkForWatchParam();
  
  // Handle fullscreen change
  document.addEventListener('fullscreenchange', function() {
    const btn = document.getElementById('fullscreenBtn');
    if (btn) {
      btn.innerHTML = document.fullscreenElement 
        ? '<span>⛶</span> Exit Fullscreen' 
        : '<span>⛶</span> Fullscreen';
    }
  });
});

// When image is loaded, store reference
document.addEventListener('DOMContentLoaded', function() {
  // This will be called when image loads in player
  const observer = new MutationObserver(function(mutations) {
    mutations.forEach(function(mutation) {
      if (mutation.addedNodes.length) {
        mutation.addedNodes.forEach(function(node) {
          if (node.tagName === 'IMG') {
            currentImage = node;
            currentZoom = 1;
          }
        });
      }
    });
  });
  
  observer.observe(document.getElementById('player'), { childList: true });
});
</script>

</body>
</html>
