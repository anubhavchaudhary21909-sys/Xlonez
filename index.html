<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>XLonez Player</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
body {
  margin: 0;
  background: #0f0f0f;
  font-family: Arial, sans-serif;
  color: #fff;
}
.app {
  max-width: 480px;
  margin: 60px auto;
  padding: 24px;
  background: #1a1a1a;
  border-radius: 14px;
}
h2 {
  text-align: center;
  margin-bottom: 20px;
}
input, button {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 6px;
  border: none;
  font-size: 1rem;
}
input {
  background: #2a2a2a;
  color: #fff;
}
button {
  background: #e50914;
  color: #fff;
}
.link {
  word-break: break-word;
  color: #00e0ff;
  font-size: 0.9rem;
}
.player {
  position: fixed;
  inset: 0;
  background: #000;
  display: none;
}
video, iframe {
  width: 100%;
  height: 100%;
}
</style>
</head>

<body>

<div class="app" id="home">
  <h2>XLonez Player</h2>
  <input id="videoUrl" placeholder="Paste video URL">
  <input id="expiry" type="number" placeholder="Expiry (minutes)">
  <button onclick="generate()">Generate Link</button>
  <div class="link" id="result"></div>
</div>

<div class="player" id="player"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA8Ck4k7gMfn9oU1nq-JBijML1JE6yVx84",
  authDomain: "project45-627cc.firebaseapp.com",
  databaseURL: "https://project45-627cc-default-rtdb.firebaseio.com",
  projectId: "project45-627cc",
  storageBucket: "project45-627cc.firebasestorage.app",
  messagingSenderId: "850515567224",
  appId: "1:850515567224:web:bcbed252ee8596c08fc38d"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function generate() {
  const url = videoUrl.value.trim();
  if (!url) return alert("Enter video URL");

  const id = Math.random().toString(36).slice(2, 10);
  const exp = expiry.value ? Date.now() + expiry.value * 60000 : null;

  db.ref("xlonez_links/" + id).set({ url, expiry: exp });

  result.innerText = location.origin + "?watch=" + id;
}

function play() {
  const id = new URLSearchParams(location.search).get("watch");
  if (!id) return;

  db.ref("xlonez_links/" + id).once("value").then(snap => {
    if (!snap.exists()) {
      document.body.innerText = "Link not found";
      return;
    }

    const data = snap.val();
    if (data.expiry && Date.now() > data.expiry) {
      document.body.innerText = "Link expired";
      return;
    }

    home.style.display = "none";
    player.style.display = "block";

    if (data.url.includes("youtube") || data.url.includes("vimeo")) {
      const iframe = document.createElement("iframe");
      iframe.src = data.url;
      iframe.allowFullscreen = true;
      player.appendChild(iframe);
    } else {
      const video = document.createElement("video");
      video.src = data.url;
      video.controls = true;
      video.autoplay = true;
      player.appendChild(video);
    }
  });
}

play();

/* SECRET BUTTON – 5 taps bottom-right */
let taps = 0;
document.addEventListener("click", e => {
  if (e.clientX > innerWidth - 60 && e.clientY > innerHeight - 60) {
    taps++;
    setTimeout(() => taps = 0, 2000);
    if (taps === 5) {
      window.open("/opposite.html", "_blank");
      taps = 0;
    }
  }
});
</script>

</body>
</html>
