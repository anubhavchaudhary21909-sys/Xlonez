<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>XLonez Player</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0f0f0f;
  font-family: Arial, sans-serif;
  color: #fff;
}

.app {
  max-width: 420px;
  margin: 80px auto;
  padding: 30px;
  background: #1a1a1a;
  border-radius: 14px;
  box-shadow: 0 0 25px rgba(0,0,0,0.7);
}

h1 {
  text-align: center;
  margin-bottom: 25px;
}

input {
  width: 100%;
  padding: 12px;
  margin-bottom: 14px;
  border-radius: 6px;
  border: none;
  background: #2a2a2a;
  color: #fff;
  font-size: 14px;
}

button {
  width: 100%;
  padding: 12px;
  background: #e50914;
  border: none;
  border-radius: 6px;
  color: #fff;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #f6121d;
}

.link-box {
  margin-top: 15px;
  font-size: 13px;
  word-break: break-all;
  color: #00e0ff;
}

/* PLAYER PAGE */
.player {
  position: fixed;
  inset: 0;
  background: #000;
  display: none;
}

video, iframe {
  width: 100%;
  height: 100%;
  border: none;
}
</style>
</head>

<body>

<div class="app" id="home">
  <h1>XLonez Player</h1>

  <input id="videoUrl" placeholder="Paste video URL">
  <input id="expiry" type="number" placeholder="Expiry (minutes) optional">

  <button onclick="generate()">Generate Link</button>

  <div class="link-box" id="result"></div>
</div>

<div class="player" id="player"></div>

<script>
function generate() {
  const url = document.getElementById("videoUrl").value.trim();
  const expiry = document.getElementById("expiry").value;

  if (!url) {
    alert("Enter video URL");
    return;
  }

  const data = {
    url,
    expiry: expiry ? Date.now() + expiry * 60000 : null
  };

  const id = Math.random().toString(36).substring(2, 9);
  localStorage.setItem(id, JSON.stringify(data));

  const link = location.origin + location.pathname + "?watch=" + id;
  document.getElementById("result").innerText = link;
}

function play() {
  const params = new URLSearchParams(location.search);
  const id = params.get("watch");
  if (!id) return;

  const data = JSON.parse(localStorage.getItem(id));
  if (!data) {
    document.body.innerHTML = "Link not found";
    return;
  }

  if (data.expiry && Date.now() > data.expiry) {
    document.body.innerHTML = "This link has expired";
    return;
  }

  document.getElementById("home").style.display = "none";
  const player = document.getElementById("player");
  player.style.display = "block";

  if (data.url.includes("youtube") || data.url.includes("vimeo")) {
    player.innerHTML = `<iframe src="${data.url}" allowfullscreen></iframe>`;
  } else {
    player.innerHTML = `<video src="${data.url}" controls autoplay></video>`;
  }
}

play();
</script>

</body>
</html>
