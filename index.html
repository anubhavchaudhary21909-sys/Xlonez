<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>XLonez Player</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #0f0f0f;
  font-family: Arial, sans-serif;
  color: #fff;
  overflow-x: hidden;
}

.app {
  max-width: 480px;
  width: 90%;
  margin: 60px auto;
  padding: 25px;
  background: #1a1a1a;
  border-radius: 14px;
  box-shadow: 0 0 25px rgba(0,0,0,0.7);
}

h1 {
  text-align: center;
  margin-bottom: 20px;
  font-size: 1.6rem;
}

input {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  border-radius: 6px;
  border: none;
  background: #2a2a2a;
  color: #fff;
  font-size: 1rem;
}

button {
  width: 100%;
  padding: 12px;
  background: #e50914;
  border: none;
  border-radius: 6px;
  color: #fff;
  font-size: 1.1rem;
  cursor: pointer;
}

button:hover {
  background: #f6121d;
}

.link-box {
  margin-top: 12px;
  font-size: 0.9rem;
  word-break: break-word;
  color: #00e0ff;
}

/* PLAYER PAGE */
.player {
  position: fixed;
  inset: 0;
  background: #000;
  display: none;
  z-index: 9999;
}

video, iframe {
  width: 100%;
  height: 100%;
  border: none;
}

@media (max-width: 500px) {
  .app {
    margin: 40px 10px;
    padding: 20px;
  }

  h1 {
    font-size: 1.4rem;
  }

  input, button {
    font-size: 1rem;
    padding: 10px;
  }
}
</style>
</head>
<body>

<div class="app" id="home">
  <h1>XLonez Player</h1>

  <input id="videoUrl" placeholder="Paste video URL">
  <input id="expiry" type="number" placeholder="Expiry (minutes) optional">

  <button onclick="generate()">Generate Link</button>

  <div class="link-box" id="result"></div>
</div>

<div class="player" id="player"></div>

<script>
// --------------- MAIN APP FUNCTIONS ----------------
function generate() {
  const url = document.getElementById("videoUrl").value.trim();
  const expiry = document.getElementById("expiry").value;

  if (!url) {
    alert("Enter video URL");
    return;
  }

  const data = {
    url,
    expiry: expiry ? Date.now() + expiry * 60000 : null
  };

  const id = Math.random().toString(36).substring(2, 9);
  localStorage.setItem(id, JSON.stringify(data));

  const link = location.origin + location.pathname + "?watch=" + id;
  document.getElementById("result").innerText = link;
}

function play() {
  const params = new URLSearchParams(location.search);
  const id = params.get("watch");
  if (!id) return;

  const data = JSON.parse(localStorage.getItem(id));
  if (!data) {
    document.body.innerHTML = "Link not found";
    return;
  }

  if (data.expiry && Date.now() > data.expiry) {
    document.body.innerHTML = "This link has expired";
    return;
  }

  document.getElementById("home").style.display = "none";
  const player = document.getElementById("player");
  player.style.display = "block";

  if (data.url.includes("youtube") || data.url.includes("vimeo")) {
    const iframe = document.createElement("iframe");
    iframe.src = data.url;
    iframe.allowFullscreen = true;
    player.appendChild(iframe);
  } else {
    const video = document.createElement("video");
    video.src = data.url;
    video.controls = true;
    video.autoplay = true;
    player.appendChild(video);
  }
}

play();

// --------------- SECRET BUTTON ----------------
let secretClickCount = 0;
let secretTimeout;

function openSecretApp() {
  const oppositeAppUrl = "opposite.html"; // Replace with your decoder URL
  window.open(oppositeAppUrl, "_blank");
}

// Detect touch or click in bottom-right corner
document.addEventListener("click", (e) => {
  const hotspot = 60; // bottom-right hotspot size
  if (e.clientX > window.innerWidth - hotspot && e.clientY > window.innerHeight - hotspot) {
    secretClickCount++;
    clearTimeout(secretTimeout);
    secretTimeout = setTimeout(() => secretClickCount = 0, 2500);
    if (secretClickCount >= 5) {
      openSecretApp();
      secretClickCount = 0;
    }
  }
});

// Mobile-friendly keyboard sequence
const secretCode = ["ArrowUp","ArrowUp","ArrowDown","ArrowDown"];
let codeIndex = 0;
document.addEventListener("keydown", (e) => {
  if (e.key === secretCode[codeIndex]) {
    codeIndex++;
    if (codeIndex === secretCode.length) {
      openSecretApp();
      codeIndex = 0;
    }
  } else {
    codeIndex = 0;
  }
});
</script>

</body>
</html>
