<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>XLonez Player</title>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#0f0f0f;
  font-family:Arial,sans-serif;
  color:#fff;
}
.app{
  max-width:420px;
  margin:60px auto;
  padding:24px;
  background:#1a1a1a;
  border-radius:14px;
}
h1{text-align:center;margin-bottom:20px}
input,button{
  width:100%;
  padding:12px;
  border-radius:6px;
  border:none;
  font-size:15px;
}
input{background:#2a2a2a;color:#fff;margin-bottom:14px}
button{background:#e50914;color:#fff}
.link{margin-top:12px;color:#00e0ff;word-break:break-all;font-size:13px}
.player{
  position:fixed;
  inset:0;
  background:#000;
  display:none;
}
video,iframe{width:100%;height:100%;border:none}
.secret{position:fixed;bottom:0;right:0;width:40px;height:40px;opacity:0}
</style>
</head>

<body>

<div class="app" id="home">
  <h1>XLonez Player</h1>
  <input id="url" placeholder="Paste video URL">
  <input id="exp" type="number" placeholder="Expiry (minutes optional)">
  <button onclick="generate()">Generate Link</button>
  <div class="link" id="out"></div>
</div>

<div class="player" id="player"></div>
<div class="secret" id="secret"></div>

<script>
/* CONFIG */
const TOKEN="XLZ-9A7F-SECRET";
const PATH="_x9Lz_k3y_98";

/* FIREBASE */
firebase.initializeApp({
  apiKey:"AIzaSyA8Ck4k7gMfn9oU1nq-JBijML1JE6yVx84",
  authDomain:"project45-627cc.firebaseapp.com",
  databaseURL:"https://project45-627cc-default-rtdb.firebaseio.com",
  projectId:"project45-627cc"
});
const db=firebase.database();

/* CREATE */
function generate(){
  if(!url.value.trim()) return alert("Enter URL");
  const id=btoa(Date.now()+"_"+Math.random()).replace(/=/g,"");
  db.ref(PATH+"/"+id).set({
    url:url.value.trim(),
    expiry:exp.value?Date.now()+exp.value*60000:null
  });
  out.innerText=location.origin+location.pathname+"?watch="+id;
}

/* CLEANUP */
db.ref(PATH).once("value",s=>{
  s.forEach(c=>{
    const d=c.val();
    if(d.expiry && Date.now()>d.expiry){
      db.ref(PATH+"/"+c.key).remove();
    }
  });
});

/* PLAY */
const id=new URLSearchParams(location.search).get("watch");
if(id){
  db.ref(PATH+"/"+id).once("value",s=>{
    if(!s.exists()) return document.body.innerText="Link not found";
    const d=s.val();
    if(d.expiry && Date.now()>d.expiry){
      db.ref(PATH+"/"+id).remove();
      return document.body.innerText="Link expired";
    }
    home.style.display="none";
    player.style.display="block";
    player.innerHTML=d.url.includes("youtube")
      ?`<iframe src="${d.url}" allowfullscreen></iframe>`
      :`<video src="${d.url}" controls autoplay></video>`;
  });
}

/* SECRET BUTTON */
let t=0,tm=null;
secret.onclick=()=>{
  t++;
  if(!tm) tm=setTimeout(()=>{t=0;tm=null},1500);
  if(t>=5){
    window.open("/opposite.html?key="+TOKEN,"_blank");
    t=0;
  }
};

document.addEventListener("contextmenu",e=>e.preventDefault());
</script>

</body>
</html>
