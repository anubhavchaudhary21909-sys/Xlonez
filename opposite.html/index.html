<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XLonez Decoder</title>

<script>
const SECRET="XLZ-9A7F-SECRET";
if(new URLSearchParams(location.search).get("key")!==SECRET){
  document.body.innerText="Access Denied";
  throw "";
}
</script>

<style>
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  text-align:center;
}
.box{
  background:#111;
  padding:20px;
  border-radius:10px;
  width:90%;
  max-width:400px;
}
input,button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:6px;
  margin-top:10px;
}
input{background:#222;color:#fff}
button{background:#e50914;color:#fff}
</style>
</head>

<body>

<div class="box">
  <h3>XLonez Decoder</h3>
  <input id="code" placeholder="Paste XLonez link">
  <button onclick="decode()">Decode</button>
  <div id="res" style="margin-top:10px;font-size:13px;color:#00e0ff"></div>
</div>

<script>
function decode(){
  try{
    const u=new URL(code.value.trim());
    const id=u.searchParams.get("watch");
    if(!id) throw "";
    res.innerText="Decoded ID: "+id;
  }catch{
    res.innerText="Invalid link";
  }
}
</script>

</body>
</html>
